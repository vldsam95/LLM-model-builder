[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny-bilingual-assistant"
version = "0.1.0"
description = "Educational tiny GPT-style bilingual assistant built from scratch in PyTorch."
requires-python = ">=3.11"
license = {file = "LICENSE"}

[project.urls]
Repository = "https://github.com/vldsam95/LLM-model-builder"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "tokenizer*"]

[tool.setuptools]
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "licenses/CC-BY-SA-4.0.txt", "data/ATTRIBUTION.md"]

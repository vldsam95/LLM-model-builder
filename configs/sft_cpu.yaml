seed: 42
device: cpu
experiment_name: tiny_cpu_sft
output_dir: checkpoints/tiny_cpu_sft
tokenizer_model: tokenizer/tiny_bilingual.model
train_sft_path: data/processed/sft_train.pt
val_sft_path: data/processed/sft_val.pt
sequence_length: 192
batch_size: 6
grad_accum_steps: 2
num_epochs: 8
learning_rate: 0.00015
min_learning_rate: 0.000015
weight_decay: 0.05
dropout: 0.1
max_grad_norm: 1.0
eval_every_steps: 40
save_every_steps: 80
log_every_steps: 10
warmup_steps: 20
early_stopping_patience: 4
resume_from: null
init_checkpoint: checkpoints/domain_cpu_adapt/best.pt
num_workers: 0
amp: false
model:
  vocab_size: 3200
  max_seq_len: 192
  d_model: 256
  n_heads: 8
  n_kv_heads: 8
  n_layers: 6
  ffn_mult: 4.0
  dropout: 0.1
  bias: true
  norm_type: layernorm
  ffn_type: gelu
  tie_embeddings: true

seed: 42
device: cpu
experiment_name: tiny_cpu_builder_base
output_dir: checkpoints/tiny_cpu_builder_base
tokenizer_model: tokenizer/tiny_bilingual.model
train_sft_path: data/processed/sft_builder_base_train.pt
val_sft_path: data/processed/sft_builder_base_val.pt
sequence_length: 128
batch_size: 8
grad_accum_steps: 1
num_epochs: 12
learning_rate: 0.00025
min_learning_rate: 0.000025
weight_decay: 0.01
dropout: 0.05
max_grad_norm: 1.0
eval_every_steps: 20
save_every_steps: 40
log_every_steps: 10
warmup_steps: 10
early_stopping_patience: 5
resume_from: null
init_checkpoint: checkpoints/tiny_cpu_pretrain/best.pt
num_workers: 0
amp: false
model:
  vocab_size: 3200
  max_seq_len: 128
  d_model: 256
  n_heads: 8
  n_kv_heads: 8
  n_layers: 6
  ffn_mult: 4.0
  dropout: 0.05
  bias: true
  norm_type: layernorm
  ffn_type: gelu
  tie_embeddings: true

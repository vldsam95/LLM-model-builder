seed: 42
device: cpu
experiment_name: domain_cpu_adapt
output_dir: checkpoints/domain_cpu_adapt
tokenizer_model: tokenizer/tiny_bilingual.model
train_tokens_path: data/processed/domain_train_tokens.pt
val_tokens_path: data/processed/domain_val_tokens.pt
sequence_length: 128
batch_size: 8
grad_accum_steps: 2
num_epochs: 4
learning_rate: 0.00035
min_learning_rate: 0.000035
weight_decay: 0.05
dropout: 0.1
max_grad_norm: 1.0
eval_every_steps: 60
save_every_steps: 120
log_every_steps: 10
warmup_steps: 20
early_stopping_patience: 3
resume_from: null
init_checkpoint: checkpoints/tiny_cpu_pretrain/best.pt
num_workers: 0
amp: false
model:
  vocab_size: 3200
  max_seq_len: 128
  d_model: 256
  n_heads: 8
  n_kv_heads: 8
  n_layers: 6
  ffn_mult: 4.0
  dropout: 0.1
  bias: true
  norm_type: layernorm
  ffn_type: gelu
  tie_embeddings: true
